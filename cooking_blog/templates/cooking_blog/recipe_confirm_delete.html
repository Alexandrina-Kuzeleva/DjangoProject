{% extends 'cooking_blog/base.html' %}
{% load static %}

{% block title %}Удаление рецепта | ACooking{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-lg-5 text-center">
                        <i class="bi bi-exclamation-triangle-fill display-1 text-warning mb-3"></i>
                        <h1 class="h2 fw-bold mb-3">Удаление рецепта</h1>
                        <p class="lead text-secondary mb-4">
                            Вы уверены, что хотите удалить рецепт <br>
                            <strong>"{{ recipe.title }}"</strong>?
                        </p>
                        <p class="text-muted mb-4">Это действие нельзя отменить.</p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex gap-3 justify-content-center">
                                <button type="submit" class="btn btn-danger rounded-pill px-5">
                                    Да, удалить
                                </button>
                                <a href="{% url 'recipe_detail' recipe.pk %}" class="btn btn-outline-secondary rounded-pill px-5">
                                    Отмена
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
